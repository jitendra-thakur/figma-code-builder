name: Stage npm package for approval

on:
  workflow_call:
    inputs:
      version:
        description: Package version to publish
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure public npm registry without credentials
        run: printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/npmrc"

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist

      - name: Verify tarball version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          NODE_AUTH_TOKEN: ''
        run: |
          TARBALL="$(find dist -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "$TARBALL" ]]; then
            echo "No npm tarball was downloaded."
            exit 1
          fi

          PACKAGE_INFO="$(tar -xOf "$TARBALL" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);console.log(`${p.name} ${p.version}`)})')"
          PACKAGE_NAME="${PACKAGE_INFO% *}"
          TARBALL_VERSION="${PACKAGE_INFO##* }"
          if [[ "$TARBALL_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Tarball version $TARBALL_VERSION does not match release $RELEASE_VERSION."
            exit 1
          fi

          if npm view "$PACKAGE_NAME@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "::error::$PACKAGE_NAME@$RELEASE_VERSION is already published. Bump package.json and package-lock.json to a new version before releasing."
            exit 1
          fi

      - name: Stage package for maintainer approval
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          NODE_AUTH_TOKEN: ''
        run: |
          TARBALL="$(find dist -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          mkdir -p staged-package
          tar -xzf "$TARBALL" -C staged-package
          cd staged-package/package
          npm stage publish --access public