name: Release npm package

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag or commit to publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  version:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.pull_request.merged == true
    uses: ./.github/workflows/version.yml
    with:
      ref: ${{ inputs.release_ref || github.event.pull_request.merge_commit_sha }}

  tag:
    needs: version
    uses: ./.github/workflows/tag.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ inputs.release_ref || github.event.pull_request.merge_commit_sha }}
    permissions:
      contents: write

  build-pack:
    needs: [version, tag]
    uses: ./.github/workflows/build-pack.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read

  publish:
    needs: [version, build-pack]
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      id-token: write