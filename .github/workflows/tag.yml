name: Tag package release

on:
  workflow_call:
    inputs:
      version:
        description: Package version to tag
        required: true
        type: string
      ref:
        description: Merged commit to tag
        required: true
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Confirm checked-out package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Package version $PACKAGE_VERSION does not match requested version $RELEASE_VERSION."
            exit 1
          fi

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          RELEASE_SHA="$(git rev-parse "$RELEASE_REF^{commit}")"
          TAG_NAME="v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            EXISTING_TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"
            if [[ "$EXISTING_TAG_SHA" != "$RELEASE_SHA" ]]; then
              echo "$TAG_NAME already exists but points to a different commit."
              exit 1
            fi
            echo "$TAG_NAME already points to the requested commit; leaving it unchanged."
          else
            git tag -a "$TAG_NAME" "$RELEASE_SHA" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi